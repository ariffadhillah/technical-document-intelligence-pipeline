[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-document-intelligence-pipeline"
version = "0.1.0"
description = "Technical document intelligence pipeline for OCR, Vision AI, structured extraction and RAG."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]